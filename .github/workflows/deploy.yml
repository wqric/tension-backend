name: Full Auto Deploy
on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Go App
        run: go build -v -o myapp_new ./cmd

      - name: Deploy Binary
        run: |
          sudo systemctl stop fitness.service || true
          mv myapp_new /root/tension/myapp
          chmod +x /root/tension/myapp

      - name: Start Service
        run: sudo systemctl start fitness.service

      - name: Verify Service
        run: |
          sleep 2
          systemctl is-active --quiet fitness.service \
            && echo "✅ Service is running" \
            || (journalctl -u fitness.service -n 20 && exit 1)
